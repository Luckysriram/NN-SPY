[project]
name = "nn-spy"
version = "0.1.0"
description = "Research system for SPY put credit spreads. Paper trading only."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
    "yfinance>=0.2.40",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
