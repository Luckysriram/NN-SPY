# Entry construction and candidate filters.
spread_width: 5.0
min_dte: 30
max_dte: 45
target_delta: -0.20
profit_target_frac: 0.50
stop_loss_frac: 2.0
time_exit_dte: 7

# Candidate filters. Every rejection is recorded with its reason.
# optionsDX has no open-interest column, so this MUST stay 0 for that source
# or every candidate is rejected. See configs/data.yaml:has_open_interest.
min_oi: 0
min_volume: 1
min_credit: 0.20            # below this the trade cannot pay for its own costs
max_spread_pct: 0.50
# MEASURED: with the real calendar this gate blocks 99.69% of windows (only 22
# of 7,038 survive 2015-2023). A 30-45 day hold always spans a monthly jobs
# report and usually an FOMC -- spec 6.4's gate cannot coexist with spec 2's
# holding period. Event proximity is carried as a FEATURE (days_to_fomc,
# days_to_jobs_report) instead, which is what spec 8 asks for.
gate_on_events: false

# Conservative fills: never assume a mid fill.
slippage_per_leg: 0.025     # 0.05 per spread round-trip leg pair
commission_per_contract: 0.65
