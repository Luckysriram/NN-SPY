# Data sources and coverage. Dates are adjusted to whatever the chosen sample
# dataset actually contains -- run `make feasibility SOURCE=<path>` first.
symbol: SPY
raw_dir: data/raw
option_chains_dir: data/raw/option_chains
underlying_dir: data/raw/underlying
vix_dir: data/raw/vix
events_file: data/raw/events/events.csv

# Placeholders. feasibility_check.py reports the true range; update before use.
start: "2016-01-01"
end: "2025-12-31"

# Quote hygiene thresholds used by data/validate.py
max_spread_pct: 0.50        # (ask-bid)/mid above this => wide_spread flag
max_iv: 5.0                 # 500% IV is not a real quote
stale_quote_days: 3
