# Seeds are recorded in every experiment log. Changing one changes results.
seed: 42
numpy_seed: 42
torch_seed: 42

mlp:
  hidden1: 64
  hidden2: 32
  dropout1: 0.15
  dropout2: 0.10
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 128
  epochs: 100
  patience: 10              # early stopping on VALIDATION loss, not train loss

baselines:
  logistic_max_iter: 1000
  gb_n_estimators: 100
  gb_learning_rate: 0.1
  gb_max_depth: 3

calibration:
  method: isotonic          # fit on VALIDATION only, then frozen
  min_trades_for_threshold: 30
